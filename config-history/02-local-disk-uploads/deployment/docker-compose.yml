services:
  # No local "mysql" service anymore - the database is Amazon RDS (see
  # deployment/RDS_SETUP.md). DB_HOST below must point at the RDS endpoint.
  backend:
    build:
      context: ../backend
    container_name: society-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST is required - set it to your RDS endpoint (see RDS_SETUP.md)}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-society_management}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: society-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  uploads_data:
