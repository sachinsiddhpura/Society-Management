server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: society-management-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:society_management}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:RooT12}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# JWT signing secret - MUST be overridden via the JWT_SECRET env var in staging/production.
jwt:
  secret: ${JWT_SECRET:dev-only-change-me-society-management-secret-key-please-override-in-prod-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:./uploads}

logging:
  level:
    com.society.management: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
